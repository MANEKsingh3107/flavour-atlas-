# Publishes site/ (support page + privacy policy) to GitHub Pages.
# Apple needs both links for the App Store listing.
name: Support and privacy website

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Insert support email
        env:
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
        run: |
          if [ -z "$SUPPORT_EMAIL" ]; then
            echo "::error::Add a repository variable named SUPPORT_EMAIL (step 3 in SETUP.md), then run this again."
            exit 1
          fi
          sed -i "s|\[YOUR SUPPORT EMAIL\]|${SUPPORT_EMAIL}|g" site/*.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
